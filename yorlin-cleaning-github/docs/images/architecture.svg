<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" width="1600" height="760" role="img" aria-label="Architecture diagram: a visit goes from the customer to the domain name, the hosting, and the five pages. A booking request goes from the booking form to the form service, the owner's email, and the owner's confirmation."><rect width="1600" height="760" fill="#fff8fa"/><text x="40" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="700" fill="#1b1319">Yorlin Cleaning website: how it works</text><text x="40" y="110" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#ae1f4f">A visit</text><rect x="40" y="130" width="344" height="200" rx="16" fill="#fbeef2" stroke="#c9a08e" stroke-width="2"/><text x="64" y="182" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" fill="#1b1319">Customer</text><text x="64" y="220" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#52444c">Searches or types the address,</text><text x="64" y="248" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#52444c">on a phone or laptop.</text><line x1="390" y1="230" x2="416" y2="230" stroke="#ae1f4f" stroke-width="3"/><path d="M414 222 L426 230 L414 238 Z" fill="#ae1f4f"/><rect x="432" y="130" width="344" height="200" rx="16" fill="#fbeef2" stroke="#c9a08e" stroke-width="2"/><text x="456" y="182" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" fill="#1b1319">Domain name</text><text x="456" y="220" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#52444c">yorlincleaning.com sends</text><text x="456" y="248" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#52444c">visitors to the site. $10.46 a</text><text x="456" y="276" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#52444c">year.</text><line x1="782" y1="230" x2="808" y2="230" stroke="#ae1f4f" stroke-width="3"/><path d="M806 222 L818 230 L806 238 Z" fill="#ae1f4f"/><rect x="824" y="130" width="344" height="200" rx="16" fill="#fbeef2" stroke="#c9a08e" stroke-width="2"/><text x="848" y="182" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" fill="#1b1319">Hosting</text><text x="848" y="220" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#52444c">Cloudflare Pages stores the</text><text x="848" y="248" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#52444c">files and adds HTTPS. Free.</text><line x1="1174" y1="230" x2="1200" y2="230" stroke="#ae1f4f" stroke-width="3"/><path d="M1198 222 L1210 230 L1198 238 Z" fill="#ae1f4f"/><rect x="1216" y="130" width="344" height="200" rx="16" fill="#ae1f4f" stroke="none" stroke-width="2"/><text x="1240" y="182" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" fill="#fff8fa">Five pages</text><text x="1240" y="220" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#fff8fa">Home, Services, Booking,</text><text x="1240" y="248" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#fff8fa">Gallery, and About &amp; Contact.</text><text x="1240" y="276" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#fff8fa">No database, no cookies.</text><text x="40" y="420" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#ae1f4f">A booking request</text><rect x="40" y="440" width="344" height="200" rx="16" fill="#fbeef2" stroke="#c9a08e" stroke-width="2"/><text x="64" y="492" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" fill="#1b1319">Booking form</text><text x="64" y="530" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#52444c">Customer picks a service, a</text><text x="64" y="558" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#52444c">date, and a time.</text><line x1="390" y1="540" x2="416" y2="540" stroke="#ae1f4f" stroke-width="3"/><path d="M414 532 L426 540 L414 548 Z" fill="#ae1f4f"/><rect x="432" y="440" width="344" height="200" rx="16" fill="#fbeef2" stroke="#c9a08e" stroke-width="2"/><text x="456" y="492" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" fill="#1b1319">Form service</text><text x="456" y="530" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#52444c">Formspree passes the request</text><text x="456" y="558" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#52444c">on and blocks spam. Free.</text><line x1="782" y1="540" x2="808" y2="540" stroke="#ae1f4f" stroke-width="3"/><path d="M806 532 L818 540 L806 548 Z" fill="#ae1f4f"/><rect x="824" y="440" width="344" height="200" rx="16" fill="#fbeef2" stroke="#c9a08e" stroke-width="2"/><text x="848" y="492" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" fill="#1b1319">My email</text><text x="848" y="530" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#52444c">The request arrives in my</text><text x="848" y="558" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#52444c">inbox.</text><line x1="1174" y1="540" x2="1200" y2="540" stroke="#ae1f4f" stroke-width="3"/><path d="M1198 532 L1210 540 L1198 548 Z" fill="#ae1f4f"/><rect x="1216" y="440" width="344" height="200" rx="16" fill="#ae1f4f" stroke="none" stroke-width="2"/><text x="1240" y="492" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" fill="#fff8fa">Confirmation</text><text x="1240" y="530" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#fff8fa">I call or email to confirm the</text><text x="1240" y="558" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#fff8fa">date, time, and price.</text><text x="40" y="726" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#52444c">Whole system running cost: about $10.46 a year. No customer pays or logs in online.</text></svg>